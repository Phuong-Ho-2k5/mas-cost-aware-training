# Clipping quá chặt ngay từ đầu; thử nới ngưỡng, giữ LR và optimizer khác.
dataset: cifar10
device: cuda
seed: 11
train_samples: 4096
val_samples: 1024
batch_size: 16
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.0
grad_clip_norm: 0.01
max_epochs: 12
observation_interval: 2
window: 2
trial_horizon: 2
max_trials: 2
budget_seconds: 900
epoch_seconds_estimate: 20
worker_overhead_seconds: 10
safety_margin: 0.3
analysis_mode: openrouter
allowed_interventions:
  - {parameter: grad_clip_norm, operation: set, value: 1.0}
  - {parameter: grad_clip_norm, operation: set, value: 5.0}
