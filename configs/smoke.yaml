# Synthetic CPU data for plumbing tests only. Not CIFAR-10 evidence.
dataset: synthetic
device: cpu
train_samples: 128
val_samples: 32
batch_size: 16
# Start with the fault LR; this smoke scenario is intentionally unstable.
learning_rate: 1.0
max_epochs: 6
observation_interval: 2
trial_horizon: 1
max_trials: 2
budget_seconds: 180
epoch_seconds_estimate: 2
worker_overhead_seconds: 10
analysis_mode: openrouter
