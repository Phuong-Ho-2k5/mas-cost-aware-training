# Initial state and experiment policy only. Planner generates all trial values and horizons.
schema_version: 3
dataset: synthetic
device: cpu
seed: 11
train_samples: 128
val_samples: 32
observation_interval: 1
window: 5
analysis_mode: local
model_id: Qwen/Qwen2.5-0.5B-Instruct
training:
  optimizer: sgd
  learning_rate: 0.1
  momentum: 0.99
  weight_decay: 0.5
  grad_clip_norm: null
  batch_size: 16
  gradient_accumulation: 1
  scheduler: none
policy:
  max_epochs: 8
  max_trials: 3
  budget_seconds: 300
  epoch_seconds_estimate: 4
  worker_overhead_seconds: 10
  safety_margin: 0.3
  min_gain: 0.005
  cooldown_rounds: 2
