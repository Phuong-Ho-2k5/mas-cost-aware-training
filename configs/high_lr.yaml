# Real CIFAR-10 subset for a short local demo; not a full benchmark.
dataset: cifar10
device: cuda
train_samples: 4096
val_samples: 1024
batch_size: 16
seed: 11
# Start with the unsuitable LR from the first optimizer step.
learning_rate: 0.1
max_epochs: 10
observation_interval: 2
window: 2
trial_horizon: 2
min_trial_horizon: 1
max_trials: 2
lr_factors: [0.5, 0.1]
min_gain: 0.005
budget_seconds: 900
epoch_seconds_estimate: 20
worker_overhead_seconds: 10
safety_margin: 0.3
analysis_mode: openrouter
